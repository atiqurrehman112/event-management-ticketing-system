<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Tickets | EventHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/styles.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html"><span class="brand-mark">EH</span>EventHub</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
            <li class="nav-item"><a class="nav-link" href="events.html"><i class="bi bi-calendar2-event me-1"></i>Events</a></li>
            <li class="nav-item"><a class="nav-link active" href="my-tickets.html"><i class="bi bi-ticket-perforated me-1"></i>My Tickets</a></li>
            <li class="nav-item d-none" data-admin-only><a class="nav-link" href="admin-dashboard.html"><i class="bi bi-speedometer2 me-1"></i>Admin</a></li>
            <li class="nav-item ms-lg-3" id="authLinks"></li>
          </ul>
        </div>
      </div>
    </nav>

    <main>
      <section class="page-hero">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3">
          <div>
            <p class="eyebrow mb-2">Account</p>
            <h1 class="fw-bold display-6 mb-1">My Tickets</h1>
            <p class="muted mb-0">View confirmed and cancelled bookings in one polished timeline.</p>
          </div>
          <a class="btn btn-primary" href="events.html"><i class="bi bi-plus-circle me-2"></i>Book More</a>
        </div>
      </section>
      <section class="section-shell">
        <div class="container">
          <div class="fade-in" id="ticketsList">
            <div class="empty-state">Loading tickets...</div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container d-flex flex-column flex-md-row justify-content-between gap-3">
        <p class="mb-0">Plans changed? Confirmed tickets can be cancelled from this page.</p>
        <a href="events.html">Explore events</a>
      </div>
    </footer>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/tickets.js"></script>
  </body>
</html>
