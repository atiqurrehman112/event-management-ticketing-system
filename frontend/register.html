<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | EventHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/styles.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html"><span class="brand-mark">EH</span>EventHub</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
            <li class="nav-item"><a class="nav-link" href="events.html"><i class="bi bi-calendar2-event me-1"></i>Events</a></li>
            <li class="nav-item ms-lg-3" id="authLinks"></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="auth-shell">
      <div class="container">
        <div class="row g-4 justify-content-center align-items-stretch">
          <div class="col-lg-5 d-none d-lg-block">
            <div class="auth-aside surface-strong h-100 p-4 d-flex align-items-end">
              <div>
                <span class="badge badge-hot mb-3">Fast booking</span>
                <h2 class="h3 fw-bold">Your next seat is a few clicks away.</h2>
                <p class="mb-0 muted">Create an attendee account and keep all tickets organized in one place.</p>
              </div>
            </div>
          </div>
          <div class="col-lg-5">
            <div class="surface-strong p-4 p-md-5 h-100 fade-in">
              <p class="eyebrow mb-2">Join EventHub</p>
              <h1 class="h2 fw-bold mb-2">Create your account</h1>
              <p class="muted mb-4">Register to book events, manage your tickets, and cancel bookings when plans change.</p>
              <form id="registerForm" novalidate>
                <div class="mb-3">
                  <label class="form-label" for="name">Full name</label>
                  <input class="form-control" id="name" type="text" autocomplete="name" placeholder="Jane User" required>
                </div>
                <div class="mb-3">
                  <label class="form-label" for="email">Email address</label>
                  <input class="form-control" id="email" type="email" autocomplete="email" placeholder="jane@example.com" required>
                </div>
                <div class="mb-4">
                  <label class="form-label" for="password">Password</label>
                  <input class="form-control" id="password" type="password" autocomplete="new-password" minlength="6" placeholder="Minimum 6 characters" required>
                </div>
                <button class="btn btn-primary w-100" type="submit"><i class="bi bi-person-plus me-2"></i>Create Account</button>
              </form>
              <p class="muted mt-4 mb-0">Already registered? <a class="text-light fw-bold" href="login.html">Login</a>.</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
  </body>
</html>
