<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Event | EventHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/styles.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html"><span class="brand-mark">EH</span>EventHub</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
            <li class="nav-item"><a class="nav-link" href="admin-dashboard.html"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link active" href="add-event.html"><i class="bi bi-plus-circle me-1"></i>Add Event</a></li>
            <li class="nav-item ms-lg-3" id="authLinks"></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="section-shell">
      <div class="container">
        <div class="row g-4 align-items-start">
          <div class="col-lg-4">
            <div class="surface-strong p-4 sticky-lg-top" style="top: 98px;">
              <p class="eyebrow mb-2">Event builder</p>
              <h1 class="fw-bold mb-3" id="formTitle">Add Event</h1>
              <p class="muted mb-4">Create polished public event listings with pricing, capacity, venue details, and poster artwork.</p>
              <div class="surface-soft p-3">
                <span class="muted small d-block">Poster support</span>
                <strong>JPG, PNG, WebP, GIF</strong>
              </div>
            </div>
          </div>
          <div class="col-lg-8">
            <div class="surface p-4 p-md-5 fade-in">
              <form id="eventForm" novalidate>
                <div class="row g-3">
                  <div class="col-md-8">
                    <label class="form-label" for="title">Event title</label>
                    <input class="form-control" id="title" name="title" type="text" placeholder="Product Leadership Summit" required>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label" for="category">Category</label>
                    <input class="form-control" id="category" name="category" type="text" placeholder="Conference" required>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="description">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="4" placeholder="Describe the experience, audience, and agenda." required></textarea>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label" for="date">Date</label>
                    <input class="form-control" id="date" name="date" type="date" required>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label" for="time">Time</label>
                    <input class="form-control" id="time" name="time" type="time" required>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label" for="price">Price</label>
                    <input class="form-control" id="price" name="price" type="number" min="0" step="0.01" placeholder="75" required>
                  </div>
                  <div class="col-md-5">
                    <label class="form-label" for="venue">Venue</label>
                    <input class="form-control" id="venue" name="venue" type="text" placeholder="Civic Hall" required>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label" for="city">City</label>
                    <input class="form-control" id="city" name="city" type="text" placeholder="Chicago" required>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label" for="totalTickets">Total seats</label>
                    <input class="form-control" id="totalTickets" name="totalTickets" type="number" min="1" placeholder="150" required>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="poster">Poster image</label>
                    <input class="form-control" id="poster" name="poster" type="file" accept="image/*">
                    <div class="form-hint mt-2">Recommended ratio: 16:10 for clean event cards.</div>
                  </div>
                </div>
                <div class="d-flex flex-column flex-sm-row justify-content-end gap-2 mt-4">
                  <a class="btn btn-outline-light" href="admin-dashboard.html">Cancel</a>
                  <button class="btn btn-primary" type="submit" id="submitLabel"><i class="bi bi-check2-circle me-2"></i>Create Event</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/admin.js"></script>
  </body>
</html>
