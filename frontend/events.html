<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Events | EventHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/styles.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html"><span class="brand-mark">EH</span>EventHub</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
            <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house-door me-1"></i>Home</a></li>
            <li class="nav-item"><a class="nav-link active" href="events.html"><i class="bi bi-calendar2-event me-1"></i>Events</a></li>
            <li class="nav-item"><a class="nav-link" href="my-tickets.html"><i class="bi bi-ticket-perforated me-1"></i>My Tickets</a></li>
            <li class="nav-item d-none" data-admin-only><a class="nav-link" href="admin-dashboard.html"><i class="bi bi-speedometer2 me-1"></i>Admin</a></li>
            <li class="nav-item ms-lg-3" id="authLinks"></li>
          </ul>
        </div>
      </div>
    </nav>

    <main>
      <section class="page-hero">
        <div class="container">
          <div class="row g-4 align-items-end">
            <div class="col-lg-6">
              <p class="eyebrow mb-2">Discover</p>
              <h1 class="fw-bold display-5 mb-2">Explore premium events</h1>
              <p class="muted mb-0">Search by keyword, category, or city and book your seat in seconds.</p>
            </div>
            <div class="col-lg-6">
              <form class="surface p-3 row g-2 align-items-end" id="filterForm">
                <div class="col-md">
                  <label class="form-label" for="search">Search</label>
                  <input class="form-control" id="search" type="search" placeholder="Product summit">
                </div>
                <div class="col-md">
                  <label class="form-label" for="category">Category</label>
                  <input class="form-control" id="category" type="text" placeholder="Conference">
                </div>
                <div class="col-md">
                  <label class="form-label" for="city">City</label>
                  <input class="form-control" id="city" type="text" placeholder="Chicago">
                </div>
                <div class="col-md-auto">
                  <button class="btn btn-primary w-100" type="submit"><i class="bi bi-funnel me-2"></i>Filter</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>

      <section class="section-shell">
        <div class="container">
          <div class="row g-4 fade-in" id="eventsList">
            <div class="col-12"><div class="empty-state">Loading events...</div></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container d-flex flex-column flex-md-row justify-content-between gap-3">
        <p class="mb-0">EventHub keeps event discovery clean, fast, and secure.</p>
        <div class="d-flex gap-3"><a href="index.html">Home</a><a href="my-tickets.html">My Tickets</a></div>
      </div>
    </footer>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/events.js"></script>
  </body>
</html>
